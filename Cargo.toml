[workspace]
members = [
    "crates/dsl_types",
    "crates/dsl-core",
    "crates/sem_os_types",
    "crates/sem_os_core",
    "crates/sem_os_ontology",
    "crates/sem_os_policy",
    "crates/semantic-decision-contracts",
    "crates/semantic-pack",
    "crates/semantic-embedder",
    "crates/dsl-integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/adamtc007/dsl"

[workspace.dependencies]
dsl_types       = { version = "0.3.0", path = "crates/dsl_types" }
dsl-core        = { version = "0.3.0", path = "crates/dsl-core" }
sem_os_types    = { version = "0.3.0", path = "crates/sem_os_types" }
sem_os_core     = { version = "0.3.0", path = "crates/sem_os_core" }
sem_os_ontology = { version = "0.3.0", path = "crates/sem_os_ontology" }
sem_os_policy   = { version = "0.3.0", path = "crates/sem_os_policy" }
semantic-decision-contracts = { version = "0.3.0", path = "crates/semantic-decision-contracts" }
semantic-pack = { version = "0.3.0", path = "crates/semantic-pack" }
semantic-embedder = { version = "0.3.0", path = "crates/semantic-embedder" }
dsl-integration-tests = { version = "0.3.0", path = "crates/dsl-integration-tests" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
