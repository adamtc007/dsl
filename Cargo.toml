[workspace]
members = [
    "crates/dsl_types",
    "crates/dsl-core",
    "crates/dsl-diagnostics",
    "crates/dsl-parser",
    "crates/dsl-atoms",
    "crates/dsl-ast",
    "crates/sem_os_types",
    "crates/sem_os_core",
    "crates/sem_os_ontology",
    "crates/sem_os_policy",
    "crates/semantic-decision-contracts",
    "crates/semantic-pack",
    "crates/semantic-embedder",
    "crates/sem-os-id",
    "crates/sem-os-append-store",
    "crates/sem-os-walk",
    "crates/dsl-integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/adamtc007/dsl"

[workspace.dependencies]
dsl_types       = { version = "0.4.0", path = "crates/dsl_types" }
dsl-core        = { version = "0.4.0", path = "crates/dsl-core" }
dsl-diagnostics = { version = "0.4.0", path = "crates/dsl-diagnostics" }
dsl-parser      = { version = "0.4.0", path = "crates/dsl-parser" }
dsl-atoms       = { version = "0.4.0", path = "crates/dsl-atoms" }
dsl-ast         = { version = "0.4.0", path = "crates/dsl-ast" }
sem_os_types    = { version = "0.4.0", path = "crates/sem_os_types" }
sem_os_core     = { version = "0.4.0", path = "crates/sem_os_core" }
sem_os_ontology = { version = "0.4.0", path = "crates/sem_os_ontology" }
sem_os_policy   = { version = "0.4.0", path = "crates/sem_os_policy" }
semantic-decision-contracts = { version = "0.4.0", path = "crates/semantic-decision-contracts" }
semantic-pack = { version = "0.4.0", path = "crates/semantic-pack" }
semantic-embedder = { version = "0.4.0", path = "crates/semantic-embedder" }
sem-os-id = { version = "0.4.0", path = "crates/sem-os-id" }
sem-os-append-store = { version = "0.4.0", path = "crates/sem-os-append-store" }
sem-os-walk = { version = "0.4.0", path = "crates/sem-os-walk" }
dsl-integration-tests = { version = "0.4.0", path = "crates/dsl-integration-tests" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
