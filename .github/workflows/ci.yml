name: Standalone shared workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal --component rustfmt
      - run: cargo +1.95 fmt --all -- --check

  check-test-clippy-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal --component clippy
      - run: cargo +1.95 check --workspace --all-targets --all-features --locked
      - run: cargo +1.95 test --workspace --all-targets --all-features --locked
      - run: cargo +1.95 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.95 doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal
      - run: cargo +1.95 check -p dsl-core --no-default-features --locked
      - run: cargo +1.95 check -p dsl-core --all-features --locked
      - run: cargo +1.95 check -p dsl_types --locked
      - run: cargo +1.95 check -p sem_os_types --locked
      - run: cargo +1.95 check -p semantic-decision-contracts --locked
      - run: cargo +1.95 check -p semantic-pack --locked
      - run: cargo +1.95 check -p semantic-embedder --no-default-features --locked
      - run: cargo +1.95 check -p semantic-embedder --features candle --locked
      - run: cargo +1.95 check -p semantic-embedder --features huggingface-download --locked

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-public-api --locked --version 0.52.0
      - run: cargo install cargo-fuzz --locked
      - run: bash scripts/check-layering.sh
      - run: bash scripts/check-dependencies.sh
      - run: bash scripts/check-domain-neutral.sh
      - run: python3 scripts/check-semantic-gameboard-contracts.py

  gameboard-contract-fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - attempt_receipt_contract
          - design_belief_contract
          - design_position_contract
          - feedback_option_contract
          - legal_move_contract
          - rule_explanation_contract
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Isolated bounded smoke
        working-directory: crates/semantic-decision-contracts/fuzz
        shell: bash
        run: |
          set +e
          set -o pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          smoke_corpus="$(mktemp -d)/corpus"
          cp -R "corpus/${{ matrix.target }}" "$smoke_corpus"
          log="smoke-log-${{ matrix.target }}.txt"
          cargo +nightly fuzz run "${{ matrix.target }}" "$smoke_corpus" -- \
            -runs=256 -max_len=2048 -timeout=5 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 ../../../scripts/write-gameboard-fuzz-receipt.py \
            --target "${{ matrix.target }}" --log "$log" \
            --output "smoke-receipt-${{ matrix.target }}.json" \
            --exit-code "$result" --runs-budget 256 --seconds-budget 0 \
            --max-len 2048 --started-at "$started" --finished-at "$finished"
          receipt_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$receipt_result"
      - name: Upload smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameboard-contract-smoke-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            crates/semantic-decision-contracts/fuzz/smoke-receipt-${{ matrix.target }}.json
            crates/semantic-decision-contracts/fuzz/smoke-log-${{ matrix.target }}.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal
      - run: bash scripts/check-packages.sh

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
