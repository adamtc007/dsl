name: Semantic Gameboard contract fuzz nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - attempt_receipt_contract
          - design_belief_contract
          - design_position_contract
          - feedback_option_contract
          - legal_move_contract
          - rule_explanation_contract
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Run independently budgeted target
        id: fuzz
        working-directory: crates/semantic-decision-contracts/fuzz
        shell: bash
        run: |
          set +e
          set -o pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          corpus="$(mktemp -d)/corpus"
          cp -R "corpus/${{ matrix.target }}" "$corpus"
          log="nightly-log-${{ matrix.target }}.txt"
          cargo +nightly fuzz run "${{ matrix.target }}" "$corpus" -- \
            -runs=100000 -max_total_time=900 -max_len=4096 -timeout=5 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 ../../../scripts/write-gameboard-fuzz-receipt.py \
            --target "${{ matrix.target }}" --log "$log" \
            --output "nightly-receipt-${{ matrix.target }}.json" \
            --exit-code "$result" --runs-budget 100000 --seconds-budget 900 \
            --max-len 4096 --started-at "$started" --finished-at "$finished"
          receipt_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$receipt_result"
      - name: Upload target receipt and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameboard-contract-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            crates/semantic-decision-contracts/fuzz/nightly-receipt-${{ matrix.target }}.json
            crates/semantic-decision-contracts/fuzz/nightly-log-${{ matrix.target }}.txt
            crates/semantic-decision-contracts/fuzz/artifacts/${{ matrix.target }}/
