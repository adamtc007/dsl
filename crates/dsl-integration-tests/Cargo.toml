[package]
name = "dsl-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
dsl-core = { path = "../dsl-core" }
sem_os_core = { path = "../sem_os_core" }
dsl_types = { path = "../dsl_types" }
sem_os_types = { path = "../sem_os_types" }
pretty_assertions = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
